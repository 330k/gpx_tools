<script>

  dist_marker: null

/**
 * テキストをFileオブジェクトから読み込む
 * @param {File} file
 * @return {Promise<String>}
 */
function loadTextFile(file){
  return new Promise(function(resolve, reject){
    try{
      const reader = new FileReader();
      reader.onload = function(){
        resolve(reader.result);
      };
      reader.readAsText(file, "utf-8");
    }catch(e){
      reject(e);
    }
  });
}

/**
 * テキストをURLから読み込む
 * @param {string} url
 * @return {Promise<String>}
 */
async function loadTextURL(url){
  const res = await fetch(url);
  return res.text();
}

/**
 * GeoJSONファイルを読み込む
 * @param {string} GeoJSONテキスト
 * @param {Object} options google.maps.MVCObjectに指定する表示オプション
 * @return {[google.maps.MVCObject]} google.maps.MVCObjectの配列
 */
function loadGeoJSON(text, options){
  const json = JSON.parse(text);
  const result = [];
  
  for(const f of json.features){
    const mapobjects = [];
    if(f.geometry.type === "Point"){
      /*mapobjects.push(new google.maps.Marker({
        position: {lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0]}
      }));*/
      mapobjects.push(new google.maps.Polyline({
        path: [
          {lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0]},
          {lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0]}
        ],
        geodesic: true,
        ...options
      }));
    }else if(f.geometry.type === "LineString"){
      mapobjects.push(new google.maps.Polyline({
        path: f.geometry.coordinates.map(e => ({lat: e[1], lng: e[0]})),
        geodesic: true,
        ...options
      }));
    }else if(f.geometry.type === "Polygon"){
      for(const c of f.geometry.coordinates){
        // 本当は穴が開いたポリゴンに対応しないといけないが・・・
        mapobjects.push(new google.maps.Polygon({
          path: c.map(e => ({lat: e[1], lng: e[0]})),
          geodesic: true,
          ...options
        }));
      }
    }else if(f.geometry.type === "MultiPoint"){
      for(const c of f.geometry.coordinates){
        /*mapobjects.push(new google.maps.Marker({
          position: {lat: c[1], lng: c[0]},
          ...options
        }));*/
        mapobjects.push(new google.maps.Polyline({
          path: [
            {lat: c[1], lng: c[0]},
            {lat: c[1], lng: c[0]}
          ],
          geodesic: true,
          ...options
        }));
      }
    }
    
    for(const mo of mapobjects){
      mo.addListener("click", function(){
        const infoarea = document.getElementById("infoarea");
        const buf = []
        buf.push("<table>");
        for(const p in f.properties){
          buf.push("<tr><th>" + p + "</th><td>" + f.properties[p] + "</td></tr>");
        }
        buf.push("</table>");
        infoarea.innerHTML = buf.join("");

      });
      result.push(mo);
    }
  }
  
  return result;
}

/**
 * GPXファイルを読み込む
 * @param {string} GPXテキスト
 * @param {Object} options google.maps.MVCObjectに指定する表示オプション
 * @return {[google.maps.MVCObject]} google.maps.MVCObjectの配列
 */
function loadGPX(text, options){
  const parser = new DOMParser();
  const xml = parser.parseFromString(text, "text/xml");
  const result = [];
  
  const trksegs = xml.querySelectorAll("trkseg");
  for(const trkseg of trksegs){
    const trkpts = trkseg.querySelectorAll("trkpt");
    const line = new google.maps.Polyline({
      path: [...trkpts].map(e => ({lat: e.getAttribute("lat") - 0, lng: e.getAttribute("lon") - 0})),
      geodesic: true,
      ...options
    });
    result.push(line);
  }
  
  return result;
}

/**
 * KMLファイルを読み込む
 * @param {string} text KMLテキスト
 * @param {Object} options google.maps.MVCObjectに指定する表示オプション
 * @return {[google.maps.MVCObject]} google.maps.MVCObjectの配列
 */
function loadKML(text, options){
  const parser = new DOMParser();
  const xml = parser.parseFromString(text, "text/xml");
  const result = [];
  
  const placemarks = xml.querySelectorAll("Placemark");
  for(const p of placemarks){
    const point = p.querySelector("Point");
    const linestring = p.querySelector("LineString");
    const polygon = p.querySelector("Polygon");
    let mo = null;
    
    if(point){
      const c = point.querySelector("coordinates").textContent.trim().split(/[\s\n]+/).map(e => e.split(","));
      /*mo = new google.maps.Marker({
        position: {lat: c[0][1] - 0, lng: c[0][0] - 0},
        ...options
      });*/
      mo = new google.maps.Polyline({
        path: [
          {lat: c[0][1] - 0, lng: c[0][0] - 0},
          {lat: c[0][1] - 0, lng: c[0][0] - 0}
        ],
        ...options
      });
    }else if(linestring){
      const c = linestring.querySelector("coordinates").textContent.trim().split(/[\s\n]+/).map(e => e.split(","));
      mo = new google.maps.Polyline({
        path: c.map(e => ({lat: e[1] - 0, lng: e[0] - 0})),
        geodesic: true,
        ...options
      });
    }else if(polygon){
      const c = polygon.querySelector("coordinates").textContent.trim().split(/[\s\n]+/).map(e => e.split(","));
      mo = new google.maps.Polygon({
        path: c.map(e => ({lat: e[1] - 0, lng: e[0] - 0})),
        geodesic: true,
        ...options
      });
    }
    
    mo.addListener("click", function(){
      const infoarea = document.getElementById("infoarea");
      const description = p.querySelector("description");
      
      infoarea.innerHTML = "<pre>" + description.textContent + "</pre>";
    });
    
    result.push(mo);
  }
  
  return result;
}

/**
 * Google Mapsに表示されたオブジェクトをクリア
 */
function clearFeatures(){
  for(const o of googlemap.objects){
    o.setMap(null);
  }
  googlemap.objects = [];
  stylefunc = styleGenerator();
}

function* styleGenerator(){
  //const colors = ["#3f3d9a", "#9a3d71", "#9a8c3d", "#3d9a56", "#3d5a9a", "#9a3d90", "#9a6d3d", "#439a3d", "#3d799a", "#843d9a", "#9a4e3d", "#629a3d"];
  const colors = ["#ff0000", "#00ff00", "#0000ff", "#ffff00", "#00ffff", "#ff00ff"];
  let i = 0;
  while(true){
    yield {
      strokeColor: colors[i % colors.length],
      strokeOpacity: 1.0,
      strokeWeight: 4,
      zIndex: 100 - i
    };
    i++;
  }
}
let stylefunc = styleGenerator();

window.addEventListener("DOMContentLoaded", async function(){
  
  // ファイル読み込み
  document.getElementById("file_base").addEventListener("change", async function(evt){
    try{
      showLoader();

      //features.length = 0;
      
      for(let i = 0; i < evt.target.files.length; i++){
        const file = evt.target.files[i];
        console.log(file);
        let options = stylefunc.next().value;
        
        const ext = file.name.split(".").pop().toLowerCase();
        if((ext === "geojson") || (ext === "json")){
          let text = await loadTextFile(file);
          googlemap.objects = googlemap.objects.concat(loadGeoJSON(text, options));
        }else if(ext === "gpx"){
          let text = await loadTextFile(file);
          googlemap.objects = googlemap.objects.concat(loadGPX(text, options));
        }else if(ext === "kml"){
          let text = await loadTextFile(file);
          googlemap.objects = googlemap.objects.concat(loadKML(text, options));
        }
      }
      
      for(const o of googlemap.objects){
        o.setMap(googlemap.map);
      }
      //fitBounds();
      //showRoutes();
      
    }catch(err){
      console.error(err);

    }finally{
      hideLoader();
      
    }
  });
  document.getElementById("file_base").addEventListener("click", function(evt){
    evt.target.value = "";
  });
});

/**
 * Google Maps JavaScript API Initialize Callback
 */
function initMap(){
  googlemap.map = new google.maps.Map(document.getElementById('map_canvas'), {
    zoom: 6,
    mapTypeId: google.maps.MapTypeId.ROADMAP,
    center: new google.maps.LatLng(35.681382, 139.766084),
    fullscreenControl: false,
    gestureHandling: "greedy"
  });
  
  hideLoader();
}

function hideLoader(){
  document.getElementById("loader_bg").style.display = "none";
}

function showLoader(){
  document.getElementById("loader_bg").style.display = "block";
}

// ドラッグドロップ対応
window.addEventListener("DOMContentLoaded", function(){
  function addDropArea(droparea, target){
    const overlay = document.createElement("div");
    
    overlay.style.position = "absolute";
    overlay.style.top = "0";
    overlay.style.left = "0";
    overlay.style.width = "100%";
    overlay.style.height = "100%";
    overlay.style.zIndex = "9998";
    overlay.style.backgroundColor = "#ddd";
    overlay.style.opacity = "0.5";
    overlay.style.display = "none";
    
    droparea.appendChild(overlay);
    droparea.addEventListener("dragover", function(e){
      e.stopPropagation();
      e.preventDefault();
      overlay.style.display = "block";
    }, false);
    overlay.addEventListener("dragleave", function(e){
      e.stopPropagation();
      e.preventDefault();
      overlay.style.display = "none";
    }, false);
    overlay.addEventListener("drop", function(e){
      e.stopPropagation();
      e.preventDefault();
      overlay.style.display = "none";
      
      target.files = e.dataTransfer.files;

      target.dispatchEvent(new Event("change"));
    }, false);
  }
  
  addDropArea(document.body, document.getElementById("file_base"));
});

// ドラッグドロップ失敗時にファイルがダウンロードされるのを防止
window.addEventListener("dragover", function(e){
  e = e || event;
  e.preventDefault();
}, false);
window.addEventListener("drop", function(e){
  e = e || event;
  e.preventDefault();
}, false);
</script>
